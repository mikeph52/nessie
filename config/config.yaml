# List of sample IDs
# Maybe change the variable i dkno
samples:
  - sample1
  - sample2

# Select what assembler you want to use: flye or hifiasm
assembler: flye

# Estimated genome size (for flye and QUAST), QUAST only supports the raw number instead of the "500m"
genome_size: "500000000"

threads:
  samtools: 16
  flye: 32
  hifiasm: 32
  medaka: 16
  purge_haplotigs: 16
  kraken2: 16
  quast: 8
  busco: 16
  multiqc: 8
  nanostat: 8

flye:
  read_type: "--nano-hq"    # --nano-raw # --nano-hq # --pacbio-raw # --pacbio-hifi
  extra_args: ""

hifiasm:
  extra_args: ""

polish: true #if HiFi ,set to false

medaka:
  model: "r1041_e82_400bps_sup_v5.2.0"   # most recent basecaller model from dorado
  extra_args: ""

purge_haplotigs:
  extra_args: ""

kraken2:
  db: "data/kraken2_db" # path to Kraken2 db
  confidence: "0.1" # 0.1 for low conf, 0.2-0.5 for better results
  extra_args: ""

quast:
  extra_args: ""

busco:
  lineage: "cetartiodactyla_odb10" # replace with your desired target lineage
  mode: "genome"
  download_path: "busco_downloads" # for offline mode
  extra_args: ""